/* Layout: one centered card per question, progress strip on top, nav pinned to the card's foot */

}

body::before, body::after, .wrap::after { content: ""; position: fixed; z-index: -1; pointer-events: none; opacity: var(--petal-op);
  background: var(--flower) center / contain no-repeat; filter: drop-shadow(0 12px 16px var(--shadow)); }
body::before { width: min(46vw, 340px); aspect-ratio: 1; top: 6vh; right: -6vw; rotate: 12deg; animation: orbit 22s linear infinite; }
body::after { width: min(34vw, 240px); aspect-ratio: 1; bottom: 4vh; left: -5vw; rotate: -8deg; animation: orbit 28s linear infinite reverse; }
/* Third flower at the upper left of the column; scrolls with the page */
html { overflow-x: clip; }
.wrap { position: relative; }
.wrap::after { position: absolute; width: clamp(220px, 44vw, 440px); aspect-ratio: 1; top: 140px; left: clamp(-340px, -28vw, -80px);
  rotate: 20deg; animation: orbit 25s linear infinite; animation-delay: -9s; }
/* A small, slow circle in place; the flower stays upright (rotate, move out, rotate back) */
@keyframes orbit { from { transform: rotate(0deg) translateX(14px) rotate(0deg); } to { transform: rotate(360deg) translateX(14px) rotate(-360deg); } }

.logo-face img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; }

.logo-name { font-family: var(--display); font-size: clamp(15px, 4vw, 19px); line-height: 1.15; overflow-wrap: anywhere; }
.logo-tile:hover .logo-face { border-color: var(--accent); opacity: 1; }
.logo-tile input:checked + .logo-face {
  transform: scale(1.08) translateY(-4px); filter: none; opacity: 1;

.err { color: var(--warn); font-size: 14px; font-weight: 500; }

button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.primary { background: var(--accent); color: var(--accent-fg); }
.primary:disabled { opacity: .55; cursor: default; }
.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.linkish { background: none; border: none; color: var(--accent); padding: 4px 0; font-weight: 600; text-decoration: underline; }
.center { text-align: center; justify-items: center; }
.big { font-size: 44px; line-height: 1; }
pre.copy { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 13px; margin: 0; max-height: 240px; overflow: auto; }
.admin { display: grid; gap: 12px; }
.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
tr:last-child td { border-bottom: none; }
/* Motion: page slides in from the side you're heading, contents rise in a stagger */
.card.enter { animation: slideIn .45s cubic-bezier(.2,.8,.2,1) both; }
.card.enter.back { animation-name: slideInBack; }
.card.enter > * { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 70ms); }
.card.enter .opt, .card.enter .logo-tile { animation: rise .45s cubic-bezier(.34,1.4,.64,1) both; animation-delay: calc(140ms + var(--j, 0) * 65ms); }
@keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
@keyframes slideInBack { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.float { display: inline-block; animation: float 3.2s ease-in-out infinite; }
.float.alt { animation-delay: -1.6s; }
@keyframes float { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-7px) rotate(6deg); } }
.big { display: inline-block; animation: bounceIn .8s cubic-bezier(.34,1.56,.64,1) both, float 3s ease-in-out .8s infinite; }
@keyframes bounceIn { 0% { transform: scale(0) rotate(-30deg); } 100% { transform: scale(1) rotate(0); } }
button { transition: transform .12s ease, box-shadow .2s ease, opacity .2s; }
button:active:not(:disabled) { transform: scale(.94); }
.primary:hover:not(:disabled) { box-shadow: 0 6px 18px var(--glow-soft); }
.opt:active { transform: scale(.98); }
.opt input:checked { animation: tick .3s cubic-bezier(.34,1.56,.64,1); }
@keyframes tick { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
.err:not([hidden]) { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

// ============================================================
// QUESTIONS
// ============================================================
const PAGES = [
  { id: "intro" },
  { id: "name", title: "🌟 What Should We Call You?", type: "radio",
    options: ["My first name", "My full name", "A nickname or preferred name", "A participant number (keep my name private)", "Other"],
    extra: { key: "preferredName", label: "Preferred name (optional)" } },
  { id: "brands", title: "🧋 Which Beverage Brands Have You Tried?", hint: "Select all that apply.", type: "checkbox",
    options: ["Molly Tea", "CHAGEE", "Luckin Coffee", "None of the above"], exclusive: "None of the above" },
  { id: "drinker", title: "☕ What Kind of Drinker Are You?", type: "radio",
    options: ["Tea Lover", "Coffee Lover", "Best of Both Worlds", "Occasional Drinker", "Neither", "Other"],
    other: { key: "drinkerOther", label: "Tell us more" } },
  { id: "recording", title: "🎙️ May We Record Our Conversation?", type: "radio",
    options: ["Yes, I'm comfortable with audio recording.", "No, I'd prefer written notes only."] },
  { id: "review", title: "🎬 Would You Like the Final Say?",
    hint: "Would you like to review and approve edited interview content featuring you before it is shared?", type: "radio",
    options: ["Yes, please! I'd like to review my content.", "No, thank you! I'm comfortable with the stated research uses."],
    ifFirst: { key: "reviewEmail", label: "Email for review", input: "email" } },
  { id: "gift", title: "🎁 Your $25 Gift Card" },
  { id: "consent" },
  { id: "done" }
];
const QUESTION_COUNT = PAGES.length - 2;

// ============================================================
// STATE
// ============================================================
const DRAFT_KEY = "tea-screener-draft";
let answers = {};
let step = 0;
let db = null, user = null, uid = null, saveState = "unknown"; // unknown | ok | unavailable
let celebrate = false; // confetti once, right after submitting
try { const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); if (d) { answers = d.answers || {}; step = d.step || 0; } } catch (e) {}
const saveDraft = () => { try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ answers, step })); } catch (e) {} };
const clearDraft = () => { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} };

const card = document.getElementById("card");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ============================================================
// RENDER
// ============================================================
function renderProgress() {
  const p = document.getElementById("progress");
  const isQ = step >= 1 && step <= QUESTION_COUNT;
  p.hidden = !isQ;
  if (isQ) {
    document.getElementById("barFill").style.width = (step / QUESTION_COUNT * 100) + "%";
    document.getElementById("stepLabel").textContent = step + " of " + QUESTION_COUNT;
  }
}

function navHtml(nextLabel) {
  return `<div class="nav">
    ${step > 0 ? '<button type="button" class="ghost" id="back">Back</button>' : "<span></span>"}
    <button type="submit" class="primary" id="next">${nextLabel}</button></div>`;
}

function renderIntro() {
  card.innerHTML = `
    <div class="block"><p class="muted">🎉 You're Invited! Your Opinion Matters!</p>
      <h1><span class="float">☕</span> Calling All Tea &amp; Coffee Lovers! <span class="float alt">🧋</span></h1></div>
    <p class="lede">You've been invited to share your thoughts in a special beverage experience interview!
      Whether you're a fan of Molly Tea, CHAGEE, Luckin Coffee, or simply enjoy discovering new drinks, we want to hear from you!</p>
    <div class="note"><h3>🎁 Gift Cards Are Available!</h3>
      <p>As a thank-you for your time and participation, we're offering gift cards to eligible interview participants!</p>
      <p>A <b>$25 gift card</b> will be awarded, your choice of CHAGEE or Molly Tea.</p></div>
    <div class="block"><h3>✨ Here's What to Expect</h3>
      <ul class="list"><li>🧋 Share your favorite drinks and beverage experiences.</li>
        <li>💬 Tell us what makes a brand stand out to you.</li>
        <li>🌟 Help us uncover what customers really value.</li>
        <li>🎓 Contribute to a university marketing research project.</li></ul></div>
    <div class="facts"><span>⏱ <b>Interview Duration:</b> Approximately 30–40 minutes</span><span>📍 <b>Format:</b> One-on-one conversation</span></div>
    <p>🎁 The best part? There are no right or wrong answers. Your unique experiences and honest opinions are what make this research valuable!</p>
    <p class="muted">Participation is completely voluntary. You may skip any question or stop the interview at any time.</p>
    ${navHtml("Ready? Let's get started! 🎉")}`;
}

function renderQuestion(q) {
  const val = answers[q.id];
  const isChecked = (o) => q.type === "checkbox" ? (val || []).includes(o) : val === o;
  const inputHtml = (o, i) => `<input type="${q.type}" name="${q.id}" id="${q.id}-${i}" value="${esc(o)}" ${isChecked(o) ? "checked" : ""}>`;
  const logoTiles = q.options.map((o, i) => o in BRAND_LOGOS
    ? `<label class="logo-tile">${inputHtml(o, i)}<span class="logo-face">${BRAND_LOGOS[o]
        ? `<img src="${esc(BRAND_LOGOS[o])}" alt="${esc(o)}">` : `<span class="logo-name">${esc(o)}</span>`}</span></label>` : "").join("");
  const opts = q.options.map((o, i) => o in BRAND_LOGOS && logoTiles ? ""
    : `<label class="opt">${inputHtml(o, i)}<span>${esc(o)}</span></label>`).join("");
  const extraField = (f, show) => `<label class="field" id="wrap-${f.key}" ${show ? "" : "hidden"}>${esc(f.label)}
      <input type="${f.input || "text"}" id="${f.key}" value="${esc(answers[f.key])}" autocomplete="${f.input === "email" ? "email" : "off"}"></label>`;
  card.innerHTML = `
    <div class="block"><p class="muted">Question ${step}</p><h2>${esc(q.title)}</h2>${q.hint ? `<p class="muted">${esc(q.hint)}</p>` : ""}</div>
    ${logoTiles ? `<div class="logo-grid">${logoTiles}</div>` : ""}
    <div class="opts">${opts}</div>
    ${q.extra ? extraField(q.extra, true) : ""}
    ${q.other ? extraField(q.other, val === "Other") : ""}
    ${q.ifFirst ? extraField(q.ifFirst, val === q.options[0]) : ""}
    <p class="err" id="err" hidden></p>
    ${navHtml("Next")}`;

  card.querySelectorAll(`input[name="${q.id}"]`).forEach((input) => input.addEventListener("change", () => {
    if (q.type === "checkbox") {
      let picked = [...card.querySelectorAll(`input[name="${q.id}"]:checked`)].map((x) => x.value);
      if (input.checked && input.value === q.exclusive) picked = [q.exclusive];
      else if (input.checked) picked = picked.filter((x) => x !== q.exclusive);
      card.querySelectorAll(`input[name="${q.id}"]`).forEach((x) => { x.checked = picked.includes(x.value); });
      answers[q.id] = picked;
    } else {
      answers[q.id] = input.value;
    }
    if (q.other) document.getElementById("wrap-" + q.other.key).hidden = answers[q.id] !== "Other";
    if (q.ifFirst) document.getElementById("wrap-" + q.ifFirst.key).hidden = answers[q.id] !== q.options[0];
    saveDraft();
  }));
  [q.extra, q.other, q.ifFirst].filter(Boolean).forEach((f) =>
    document.getElementById(f.key).addEventListener("input", (e) => { answers[f.key] = e.target.value; saveDraft(); }));
}

function renderGift() {
  if (!answers.giftEmail && answers.reviewEmail) answers.giftEmail = answers.reviewEmail;
  const giftCard = (v, cls) => `<label class="gift-card brand-${cls}"><input type="radio" name="giftBrand" value="${esc(v)}" ${answers.giftBrand === v ? "checked" : ""} aria-label="${esc(v)} $25 gift card">
      <span class="gc-face"><img src="${esc(BRAND_LOGOS[v])}" alt=""><span class="gc-amt">$25</span><span class="gc-label">Gift card</span></span></label>`;
  const opt = (name, v) => `<label class="opt small"><input type="radio" name="${name}" value="${esc(v)}" ${answers[name] === v ? "checked" : ""}><span>${esc(v)}</span></label>`;
  card.innerHTML = `
    <div class="block"><p class="muted">Question ${step}</p><h2>🎁 Your $25 Gift Card</h2></div>
    <div class="block"><h3>Brand</h3><div class="gift-cards">${giftCard("CHAGEE", "chagee")}${giftCard("Molly Tea", "molly")}</div></div>
    <div class="block"><h3>Format</h3><div class="opts two">${opt("giftType", "Electronic")}${opt("giftType", "Physical card")}</div></div>
    <label class="field" id="wrap-giftEmail" ${answers.giftType === "Electronic" ? "" : "hidden"}>Email for your e-gift card
      <input type="email" id="giftEmail" value="${esc(answers.giftEmail)}" autocomplete="email"></label>
    <p class="err" id="err" hidden></p>
    ${navHtml("Next")}`;
  card.querySelectorAll('input[type="radio"]').forEach((input) => input.addEventListener("change", () => {
    answers[input.name] = input.value;
    document.getElementById("wrap-giftEmail").hidden = answers.giftType !== "Electronic";
    saveDraft();
  }));
  document.getElementById("giftEmail").addEventListener("input", (e) => { answers.giftEmail = e.target.value; saveDraft(); });
}

function renderConsent() {
  const val = answers.consent;
  card.innerHTML = `
    <div class="block"><p class="muted">Question ${step}</p><h2>✅ One Last Thing — Your Consent!</h2>
      <p>By selecting "I agree," I acknowledge that:</p></div>
    <ul class="list">
      <li>• I understand this interview is for academic research.</li>
      <li>• My participation is voluntary.</li>
      <li>• I may skip questions or stop participating at any time.</li>
      <li>• Audio recording requires my separate permission.</li>
      <li>• I understand the gift card terms described above.</li></ul>
    <div class="block"><h3>Do you agree to participate?</h3>
      <div class="opts">
        <label class="opt"><input type="radio" name="consent" id="consent-yes" value="Yes" ${val === "Yes" ? "checked" : ""}><span>Yes, I understand and agree!</span></label>
        <label class="opt"><input type="radio" name="consent" id="consent-no" value="No" ${val === "No" ? "checked" : ""}><span>No, I do not agree.</span></label>
      </div></div>
    <label class="field" id="wrap-signature" ${val === "Yes" ? "" : "hidden"}>✍️ Electronic Signature (type your full name)
      <input type="text" id="signature" value="${esc(answers.signature)}" autocomplete="name"></label>
    <p class="err" id="err" hidden></p>
    ${navHtml("Submit")}`;
  card.querySelectorAll('input[name="consent"]').forEach((input) => input.addEventListener("change", () => {
    answers.consent = input.value;
    document.getElementById("wrap-signature").hidden = input.value !== "Yes";
    saveDraft();
  }));
  document.getElementById("signature").addEventListener("input", (e) => { answers.signature = e.target.value; saveDraft(); });
}

function summaryText() {
  return [
    "Preferred way to be addressed: " + (answers.name || "—"),
    "Preferred name: " + (answers.preferredName || "—"),
    "Brands tried: " + ((answers.brands || []).join(", ") || "—"),
    "Drinker type: " + (answers.drinker || "—") + (answers.drinker === "Other" && answers.drinkerOther ? " (" + answers.drinkerOther + ")" : ""),
    "Audio recording: " + (answers.recording || "—"),
    "Review content: " + (answers.review || "—") + (answers.reviewEmail ? " (" + answers.reviewEmail + ")" : ""),
    "Gift card: " + (answers.giftBrand || "—") + " · " + (answers.giftType || "—") + (answers.giftType === "Electronic" && answers.giftEmail ? " (" + answers.giftEmail + ")" : ""),
    "Consent: " + (answers.consent || "—"),
    "Signature: " + (answers.signature || "—")
  ].join("\n");
}

function renderDone(saved) {
  const agreed = answers.consent === "Yes";
  card.innerHTML = `<div class="block center">
      <div class="big">${agreed ? "🎉" : "🙏"}</div>
      <h1>Thank You!</h1>
      <p class="lede">${agreed ? "We're excited to hear your thoughts and experiences.<br>See you at the interview! ☕ 🧋"
        : "Thanks for considering it. You won't be contacted for an interview."}</p></div>
    ${saved ? '<p class="muted center">Your answers were saved.</p>' : `
      <div class="note"><h3>Your answers could not be saved here</h3>
        <p>Copy them and send them to the research team.</p>
        <pre class="copy" id="copyText">${esc(summaryText())}</pre>
        <div><button type="button" class="ghost" id="copyBtn">Copy my answers</button></div></div>`}
    <div class="nav center" style="justify-content:center"><button type="button" class="linkish" id="edit">Change my answers</button></div>`;
  const copyBtn = document.getElementById("copyBtn");
  if (copyBtn) copyBtn.addEventListener("click", () => copy(summaryText(), copyBtn, document.getElementById("copyText")));
  document.getElementById("edit").addEventListener("click", () => { step = 1; render(); });
}

const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function animateIn(goingBack) {
  [...card.children].forEach((c, i) => c.style.setProperty("--i", i));
  card.querySelectorAll(".opt, .logo-tile").forEach((c, j) => c.style.setProperty("--j", j));
  card.classList.remove("enter", "back");
  void card.offsetWidth; // restart the animation
  card.classList.add("enter");
  if (goingBack) card.classList.add("back");
}

function confetti() {
  if (reduceMotion()) return;
  const cv = document.createElement("canvas");
  cv.id = "confetti";
  document.body.appendChild(cv);
  const ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
  const glyphs = ["☕", "🧋", "🎉", "✨", "🍵"];
  const bits = Array.from({ length: 46 }, () => ({
    x: Math.random() * W, y: -Math.random() * H * .6, vy: (2 + Math.random() * 3) * dpr,
    vx: (Math.random() - .5) * 2 * dpr, r: Math.random() * 6.28, vr: (Math.random() - .5) * .12,
    s: (18 + Math.random() * 14) * dpr, g: glyphs[Math.floor(Math.random() * glyphs.length)]
  }));
  const start = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, W, H);
    bits.forEach((b) => {
      b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
      ctx.font = b.s + "px serif"; ctx.fillText(b.g, -b.s / 2, b.s / 2); ctx.restore();
    });
    if (t - start < 4500) requestAnimationFrame(frame); else cv.remove();
  })(start);
}

let lastStep = step;
function render() {
  const goingBack = step < lastStep;
  lastStep = step;
  renderProgress();
  const page = PAGES[step];
  if (page.id === "intro") renderIntro();
  else if (page.id === "gift") renderGift();
  else if (page.id === "consent") renderConsent();
  else if (page.id === "done") renderDone(saveState === "ok");
  else renderQuestion(page);
  const back = document.getElementById("back");
  if (back) back.addEventListener("click", () => { step--; saveDraft(); render(); });
  animateIn(goingBack);
  if (page.id === "done" && answers.consent === "Yes" && celebrate) { celebrate = false; confetti(); }
  window.scrollTo({ top: 0 });
}

// ============================================================
// NAVIGATION + VALIDATION
// ============================================================
function showErr(msg) { const e = document.getElementById("err"); e.textContent = msg; e.hidden = false; }

card.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const page = PAGES[step];
  if (page.id === "review" && answers.review === page.options[0]) {
    const email = (answers.reviewEmail || "").trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showErr("Enter an email so we can send your content for review.");
  }
  if (page.id === "gift") {
    if (!answers.giftBrand) return showErr("Choose CHAGEE or Molly Tea.");
    if (!answers.giftType) return showErr("Choose electronic or a physical card.");
    if (answers.giftType === "Electronic" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((answers.giftEmail || "").trim())) return showErr("Enter an email for your e-gift card.");
  }
  if (page.id === "consent") {
    if (!answers.consent) return showErr("Choose whether you agree to participate.");
    if (answers.consent === "Yes" && !(answers.signature || "").trim()) return showErr("Type your full name to sign.");
    const btn = document.getElementById("next");
    btn.disabled = true; btn.textContent = "Saving…";
    saveState = await submit() ? "ok" : "unavailable";
    clearDraft();
    celebrate = true;
  }
  step++;
  saveDraft();
  render();
});

// ============================================================
// SAVE (db capability)
// ============================================================
function cleaned() {
  const a = { ...answers };
  if (a.drinker !== "Other") delete a.drinkerOther;
  if (a.review !== PAGES[5].options[0]) delete a.reviewEmail;
  if (a.consent !== "Yes") delete a.signature;
  if (a.giftType !== "Electronic") delete a.giftEmail;
  return a;
}

async function submit() {
  if (!db || !uid) return false;
  try {
    await db.collection("responses").doc(uid).set({ ...cleaned(), submittedAt: new Date().toISOString() });
    return true;
  } catch (e) {
    console.warn("Save failed", e && e.code);
    return false;
  }
}

async function copy(text, btn, fallbackEl) {
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
  catch (e) {
    if (fallbackEl) { const r = document.createRange(); r.selectNodeContents(fallbackEl); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    btn.textContent = "Press Ctrl+C to copy";
  }
}

// ============================================================
// OWNER VIEW: all responses
// ============================================================
const COLS = [
  ["submittedAt", "Submitted"], ["name", "Call me"], ["preferredName", "Preferred name"], ["brands", "Brands"],
  ["drinker", "Drinker"], ["drinkerOther", "Other"], ["recording", "Recording"], ["review", "Review"],
  ["reviewEmail", "Review email"], ["giftBrand", "Gift brand"], ["giftType", "Gift format"], ["giftEmail", "Gift email"], ["consent", "Consent"], ["signature", "Signature"]
];
const cell = (row, k) => k === "submittedAt" && row[k] ? new Date(row[k]).toLocaleString() : Array.isArray(row[k]) ? row[k].join(", ") : (row[k] ?? "");
let adminRows = [];

function renderAdmin() {
  document.getElementById("adminTitle").textContent = "Responses (" + adminRows.length + ")";
  const t = document.getElementById("adminTable");
  t.innerHTML = "<thead><tr>" + COLS.map(([, h]) => `<th>${h}</th>`).join("") + "</tr></thead><tbody>" +
    (adminRows.length ? adminRows.map((r) => "<tr>" + COLS.map(([k]) => `<td>${esc(cell(r, k))}</td>`).join("") + "</tr>").join("")
      : `<tr><td colspan="${COLS.length}" class="muted">No responses yet. They appear here as people submit.</td></tr>`) + "</tbody>";
}

document.getElementById("copyCsv").addEventListener("click", (e) => {
  const q = (v) => '"' + String(v).replace(/"/g, '""') + '"';
  const csv = [COLS.map(([, h]) => q(h)).join(",")].concat(adminRows.map((r) => COLS.map(([k]) => q(cell(r, k))).join(","))).join("\n");
  copy(csv, e.currentTarget);
});

// ============================================================
// BOOT
// ============================================================
render();

(async () => {
  if (!window.claude) return;
  [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  uid = user ? await user.id() : null;
  if (!db || !uid) return;

  // Returning respondent: start from their saved answers.
  try {
    const snap = await db.collection("responses").doc(uid).get();
    if (snap.exists && step === 0 && !Object.keys(answers).length) {
      const { submittedAt, ...saved } = snap.data();
      answers = saved; saveState = "ok"; step = PAGES.length - 1; render();
    }
  } catch (e) {}

  if (user.canEdit()) {
    document.getElementById("admin").hidden = false;
    renderAdmin();
    db.collection("responses").orderBy("submittedAt", "desc").onSnapshot(
      (s) => { adminRows = s.docs.map((d) => d.data()); renderAdmin(); },
      () => {}
    );
  }
})();
</script>
